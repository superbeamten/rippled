\"pl-s\"\u003e          # Always mark the release as a Windows build (avoids clashing with the\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          # upstream source tag/release of the same name).\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          case \u0026quot;${RELEASE_TAG}\u0026quot; in\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              *windows*) ;;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              *) RELEASE_TAG=\u0026quot;${RELEASE_TAG}-windows\u0026quot; ;;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          esac\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          echo \u0026quot;release_tag=${RELEASE_TAG}\u0026quot; \u0026gt;\u0026gt;\u0026quot;${GITHUB_OUTPUT}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          echo \u0026quot;Release tag: ${RELEASE_TAG}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eCheckout repository\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003euses\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eactions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 \u003c/span\u003e\u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e v7.0.0\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003ewith\u003c/span\u003e:","          \u003cspan class=\"pl-ent\"\u003eref\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ steps.ref.outputs.value }}\u003c/span\u003e","","      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eSet up Python\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003euses\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eactions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 \u003c/span\u003e\u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e v6.2.0\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003ewith\u003c/span\u003e:","          \u003cspan class=\"pl-ent\"\u003epython-version\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e\u003cspan class=\"pl-pds\"\u003e\u0026quot;\u003c/span\u003e3.13\u003cspan class=\"pl-pds\"\u003e\u0026quot;\u003c/span\u003e\u003c/span\u003e","","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Ninja is not preinstalled on the Windows runner images; the PyPI wheel\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e is the quickest way to get it and lands in the same Scripts directory\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e that setup-python already put on PATH.\u003c/span\u003e","      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eInstall Conan and Ninja\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003erun\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e|\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          pip install --upgrade \u0026quot;conan~=2.0\u0026quot; ninja\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          conan --version\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          ninja --version\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Mirror the repo\u0026#39;s `setup-conan` action: install the global config, the\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e profiles (`default`, `ci`, `sanitizers` — `ci` includes `sanitizers`,\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e which in turn includes `default`), and add the XRPLF Conan remote so\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e prebuilt dependency binaries can be reused where they match.\u003c/span\u003e","      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eSet up Conan configuration\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003erun\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e|\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          cat conan/global.conf \u0026gt;\u0026quot;$(conan config home)/global.conf\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          conan config install conan/profiles/ -tf \u0026quot;$(conan config home)/profiles/\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          conan config show \u0026#39;*\u0026#39;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          conan profile show --profile ci\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eAdd Conan remote\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eenv\u003c/span\u003e:","          \u003cspan class=\"pl-ent\"\u003eREMOTE_URL\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ inputs.conan_remote_url }}\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003erun\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e|\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          conan remote add --index 0 --force xrplf \u0026quot;${REMOTE_URL}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          conan remote list\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Cache the Conan package store (compiled dependency binaries). The key is\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e keyed on the locked dependency versions + build type, so it only misses\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e when dependencies actually change. This turns the slow \u0026quot;compile every\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e dependency from source\u0026quot; first run into a fast download on later runs.\u003c/span\u003e","      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eCache Conan dependencies\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003euses\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eactions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 \u003c/span\u003e\u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e v4.3.0\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003ewith\u003c/span\u003e:","          \u003cspan class=\"pl-ent\"\u003epath\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e~/.conan2/p\u003c/span\u003e","          \u003cspan class=\"pl-ent\"\u003ekey\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003econan-${{ inputs.runs_on }}-${{ inputs.build_type }}-tests_${{ inputs.include_tests }}-${{ hashFiles(\u0026#39;conan.lock\u0026#39;, \u0026#39;conanfile.py\u0026#39;) }}\u003c/span\u003e","          \u003cspan class=\"pl-ent\"\u003erestore-keys\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e|\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e            conan-${{ inputs.runs_on }}-${{ inputs.build_type }}-tests_${{ inputs.include_tests }}-\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e            conan-${{ inputs.runs_on }}-${{ inputs.build_type }}-\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e            conan-${{ inputs.runs_on }}-\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eGet number of processors\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eid\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003enproc\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003erun\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eecho \u0026quot;value=$(nproc 2\u0026gt;/dev/null || echo \u0026quot;${NUMBER_OF_PROCESSORS:-4}\u0026quot;)\u0026quot; \u0026gt;\u0026gt;\u0026quot;${GITHUB_OUTPUT}\u0026quot;\u003c/span\u003e","","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Build/download the C++ dependencies. `--build=missing` compiles anything\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e not available as a prebuilt binary on the remote for this toolchain.\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e `conan.lock` in the repo root is picked up implicitly and pins the exact\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e dependency revisions (see conan/lockfile/README.md).\u003c/span\u003e","      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eInstall dependencies (Conan)\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eenv\u003c/span\u003e:","          \u003cspan class=\"pl-ent\"\u003eBUILD_TYPE\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ inputs.build_type }}\u003c/span\u003e","          \u003cspan class=\"pl-ent\"\u003eBUILD_NPROC\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ steps.nproc.outputs.value }}\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003erun\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e|\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          conan install \\\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              --profile:all ci \\\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              --build=missing \\\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              --conf:all tools.cmake.cmaketoolchain:generator=Ninja \\\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              --options:host=\u0026#39;\u0026amp;:xrpld=True\u0026#39; \\\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              --options:host=\u0026#39;\u0026amp;:tests=${{ inputs.include_tests \u0026amp;\u0026amp; \u0026#39;True\u0026#39; || \u0026#39;False\u0026#39; }}\u0026#39; \\\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              --settings:all build_type=\u0026quot;${BUILD_TYPE}\u0026quot; \\\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              --conf:all tools.build:jobs=\u0026quot;${BUILD_NPROC}\u0026quot; \\\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              --conf:all tools.build:verbosity=quiet \\\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              --conf:all tools.compilation:verbosity=quiet \\\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              .\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Ninja calls cl.exe directly, so unlike the Visual Studio generator it\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e needs the MSVC developer environment (INCLUDE/LIB/PATH) to be active.\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Conan emits `conanvcvars.bat` for exactly this when the CMake generator\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e is not a Visual Studio one; fall back to the VS-provided vcvars64.bat if\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e it is missing for any reason.\u003c/span\u003e","      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eLocate MSVC developer environment\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eid\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003evcvars\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003erun\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e|\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          set -e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          CONANVCVARS=\u0026quot;$(pwd)/${BUILD_DIR}/generators/conanvcvars.bat\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          if [ -f \u0026quot;${CONANVCVARS}\u0026quot; ]; then\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              echo \u0026quot;Using Conan-generated conanvcvars.bat\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              echo \u0026quot;path=$(cygpath -w \u0026quot;${CONANVCVARS}\u0026quot;)\u0026quot; \u0026gt;\u0026gt;\u0026quot;${GITHUB_OUTPUT}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          else\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              VSWHERE=\u0026#39;/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe\u0026#39;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              VSROOT=$(cygpath -u \u0026quot;$(\u0026quot;${VSWHERE}\u0026quot; -latest -products \u0026#39;*\u0026#39; -property installationPath | tr -d \u0026#39;\\r\u0026#39;)\u0026quot;)\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              VC=\u0026quot;${VSROOT}/VC/Auxiliary/Build/vcvars64.bat\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              if [ ! -f \u0026quot;${VC}\u0026quot; ]; then\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e                  echo \u0026quot;Neither conanvcvars.bat nor vcvars64.bat found\u0026quot; \u0026gt;\u0026amp;2\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e                  exit 1\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              fi\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              echo \u0026quot;conanvcvars.bat absent; falling back to vcvars64.bat\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              echo \u0026quot;path=$(cygpath -w \u0026quot;${VC}\u0026quot;)\u0026quot; \u0026gt;\u0026gt;\u0026quot;${GITHUB_OUTPUT}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          fi\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Ninja instead of the Visual Studio generator: MSBuild launches cl.exe in\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e a way that makes it die at load time with 0xC0000139 on the VS 2026\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e runner images, for every installed toolset, both compiler hosts, with\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e and without file tracking. The exact same cl.exe, given rippled\u0026#39;s exact\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e flag set, compiles fine when invoked directly — which is precisely what\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Ninja does. Ninja is also single-config, hence no --config below and the\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e binary landing in build/ rather than build/\u0026lt;Config\u0026gt;/.\u003c/span\u003e","      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eConfigure CMake\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eworking-directory\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ env.BUILD_DIR }}\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eshell\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003ecmd\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003erun\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e|\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          call \u0026quot;${{ steps.vcvars.outputs.path }}\u0026quot; || exit /b 1\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          cmake --version\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          ninja --version\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          cmake -G Ninja ^\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              -DCMAKE_TOOLCHAIN_FILE:FILEPATH=build/generators/conan_toolchain.cmake ^\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} ^\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              -Dxrpld=ON ^\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              -Dtests=${{ inputs.include_tests \u0026amp;\u0026amp; \u0026#39;ON\u0026#39; || \u0026#39;OFF\u0026#39; }} ^\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              .. || exit /b 1\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eBuild xrpld\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eworking-directory\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ env.BUILD_DIR }}\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eshell\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003ecmd\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003erun\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e|\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          call \u0026quot;${{ steps.vcvars.outputs.path }}\u0026quot; || exit /b 1\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          cmake --build . --parallel ${{ steps.nproc.outputs.value }} --target xrpld || exit /b 1\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Gather the binary together with the example config and validators list\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e into a single folder. The files are kept individual (no zip) so they can\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e be attached to the release one by one.\u003c/span\u003e","      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eGather binary + config files\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eid\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003epackage\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eenv\u003c/span\u003e:","          \u003cspan class=\"pl-ent\"\u003eBUILD_TYPE\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ inputs.build_type }}\u003c/span\u003e","          \u003cspan class=\"pl-ent\"\u003eREF\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ steps.ref.outputs.value }}\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003erun\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e|\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          set -e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          # Make a filesystem-safe slug out of the ref (e.g. refs with \u0026#39;/\u0026#39;).\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          SLUG=$(echo \u0026quot;${REF}\u0026quot; | tr \u0026#39;/\u0026#39; \u0026#39;-\u0026#39;)\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          PKG=\u0026quot;xrpld-windows-${SLUG}-${BUILD_TYPE}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          mkdir -p \u0026quot;${PKG}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          # Ninja (single-config) writes to build/xrpld.exe; the Visual Studio\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          # generator used to write to build/\u0026lt;Config\u0026gt;/xrpld.exe. Search both so\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          # the packaging step does not depend on the generator.\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          EXE=$(find \u0026quot;${BUILD_DIR}\u0026quot; -maxdepth 2 -name xrpld.exe -type f | head -1)\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          if [ -z \u0026quot;${EXE}\u0026quot; ]; then\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              echo \u0026quot;xrpld.exe not found under ${BUILD_DIR}\u0026quot; \u0026gt;\u0026amp;2\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e              exit 1\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          fi\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          echo \u0026quot;Found binary: ${EXE}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          cp \u0026quot;${EXE}\u0026quot; \u0026quot;${PKG}/\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          cp cfg/xrpld-example.cfg \u0026quot;${PKG}/xrpld.cfg\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          cp cfg/validators-example.txt \u0026quot;${PKG}/validators.txt\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          # Sanity check + record the version for the release notes. `--version`\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          # prints several lines (version, commit hash, branch); keep only the\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          # first, since a multi-line value is invalid in GITHUB_OUTPUT.\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          VERSION=$(\u0026quot;${PKG}/xrpld.exe\u0026quot; --version || echo \u0026quot;unknown\u0026quot;)\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          VERSION=$(printf \u0026#39;%s\\n\u0026#39; \u0026quot;${VERSION}\u0026quot; | head -n 1)\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          echo \u0026quot;${VERSION}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          echo \u0026quot;pkg_dir=${PKG}\u0026quot; \u0026gt;\u0026gt;\u0026quot;${GITHUB_OUTPUT}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          echo \u0026quot;version=${VERSION}\u0026quot; \u0026gt;\u0026gt;\u0026quot;${GITHUB_OUTPUT}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          # The actual commit that was checked out and built, so the release tag\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          # points at the built code rather than the workflow\u0026#39;s own ref.\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e          echo \u0026quot;sha=$(git rev-parse HEAD)\u0026quot; \u0026gt;\u0026gt;\u0026quot;${GITHUB_OUTPUT}\u0026quot;\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e","\u003cspan class=\"pl-s\"\u003e\u003c/span\u003e      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Downloadable from the workflow run\u0026#39;s \u0026quot;Artifacts\u0026quot; section.\u003c/span\u003e","      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eUpload workflow artifact\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003euses\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eactions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a \u003c/span\u003e\u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e v7.0.1\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003ewith\u003c/span\u003e:","          \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ steps.package.outputs.pkg_dir }}\u003c/span\u003e","          \u003cspan class=\"pl-ent\"\u003epath\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ steps.package.outputs.pkg_dir }}/\u003c/span\u003e","          \u003cspan class=\"pl-ent\"\u003eretention-days\u003c/span\u003e: \u003cspan class=\"pl-c1\"\u003e14\u003c/span\u003e","          \u003cspan class=\"pl-ent\"\u003eif-no-files-found\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003eerror\u003c/span\u003e","","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e Create (or reuse) a GitHub Release for the built ref and attach the\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e individual files (xrpld.exe, xrpld.cfg, validators.txt) as separate\u003c/span\u003e","      \u003cspan class=\"pl-c\"\u003e\u003cspan class=\"pl-c\"\u003e#\u003c/span\u003e assets. `--clobber` lets you re-run the build and replace existing assets.\u003c/span\u003e","      - \u003cspan class=\"pl-ent\"\u003ename\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003ePublish to GitHub Release\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eif\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ inputs.publish_release }}\u003c/span\u003e","        \u003cspan class=\"pl-ent\"\u003eenv\u003c/span\u003e:","          \u003cspan class=\"pl-ent\"\u003eGH_TOKEN\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ github.token }}\u003c/span\u003e","          \u003cspan class=\"pl-ent\"\u003eTAG\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ steps.ref.outputs.release_tag }}\u003c/span\u003e","          \u003cspan class=\"pl-ent\"\u003ePKG\u003c/span\u003e: \u003cspan class=\"pl-s\"\u003e${{ steps.package.outputs.pkg_dir }}\u003c/span\u003e","          \u003cspan class=\"pl-ent\"\u003eVERSION\u003c/span\u003e: \u003cspan class=\